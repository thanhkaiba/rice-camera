[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "face-attendance"
version = "1.1.3"
description = "Camera attendance: recognises employees walking in, reports who is late, posts to Google Chat."
requires-python = ">=3.10"
dependencies = [
    "onnxruntime>=1.17",
    "opencv-python-headless>=4.9,<=4.11.0.86",  # Keep FFmpeg; allow older wheels for macOS 12.
    "numpy>=1.26",
    "Flask>=3.1",
    "PyYAML>=6.0",
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
face-attendance = "attendance.__main__:main"

[tool.setuptools]
packages = [
    "attendance",
    "attendance.core",
    "attendance.store",
    "attendance.vision",
    "attendance.integrations",
    "attendance.web",
    "attendance.cli",
]

[tool.setuptools.package-data]
"attendance.web" = ["templates/*.html", "static/*"]
