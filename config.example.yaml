# Copy to config.yaml and edit. Always quote times ("09:00"), otherwise YAML may misread them.
timezone: Asia/Ho_Chi_Minh
data_dir: data                 # database, face crops, logs
employees_file: employees.csv  # columns: id,name; imported once when there are no employees yet
healthcheck_url: ""            # e.g. https://hc-ping.com/<uuid>; pinged every minute so you get an alert if this PC stops
retention_days: 90             # camera photos of arrivals and unknown faces are deleted after this many days
late_evidence_days: 365        # photos of days on which a person was late are kept this long, as evidence

# Most settings below can also be changed on the admin page (Settings); values saved there
# take precedence over this file. The recognition backend, web host/port and data_dir can
# only be changed here and need a restart.

schedule:
  window_start: "08:00"   # camera starts. People arriving earlier are only counted if they pass the camera again after this time.
  late_after: "10:00"     # first seen before this = on time; not seen by then = late
  window_end: "11:00"     # camera stops, daily summary is sent
  work_days: [0, 1, 2, 3, 4]  # 0 = Monday ... 6 = Sunday

camera:
  # Ezviz: rtsp://admin:<6-letter verification code on the camera label>@<camera IP>:554/Streaming/Channels/101
  # (101 = main stream, use this; 102 = low-resolution sub stream; some models use /H.264)
  url: "rtsp://admin:ABCDEF@192.168.1.64:554/Streaming/Channels/101"
  process_fps: 5          # frames analysed per second; lower it if the CPU cannot keep up
  area: ""                # part of the picture to analyse, "left,top,right,bottom" fractions; set it on the Live camera page
  enhance_low_light: true

recognition:
  # insightface: SCRFD + ArcFace R50. Most accurate; weights are non-commercial research only
  #              (commercial licence: contact@insightface.ai).
  # opencv:      YuNet + SFace. Free for commercial use (MIT / Apache 2.0); less accurate.
  # Compare both on your photos: python -m attendance evaluate --backends insightface opencv
  backend: insightface
  detector_model: ""      # empty = default file in models/ (python -m attendance download-models)
  recognizer_model: ""
  det_size: 640           # detector input (multiple of 32). A 1080p picture is shrunk 3x at 640; use 960 if faces look small
  use_gpu: false
  cpu_threads: 0          # 0 = all CPUs but one (left for video decoding and the admin page)
  # A frame only votes if the face is big, sharp and roughly frontal enough:
  min_face_px: 60
  min_det_score: 0.65
  min_sharpness: 40
  max_yaw: 35
  max_pitch: 30
  auto_pose: true         # learn the camera's usual view of faces and measure turn/tilt from it
  # Identification. Tune these two with: python -m attendance evaluate
  accept_score: 0.45      # cosine similarity for a frame to vote; start around 0.45 (insightface) or 0.40 (opencv)
  min_margin: 0.08        # and it must beat the second most similar person by this much
  center_embeddings: false  # remove the direction all faces share; evaluate says whether it helps (needs its own accept_score)
  votes_required: 3       # frames that must agree before a person is identified
  track_timeout_s: 1.5
  unknown_min_frames: 3   # faces seen in fewer frames than this are ignored instead of reported
  # Review and learning (also under Settings -> Recognition -> Advanced)
  learn_corrections: true # a face moved to the right person on the Today page is learned as a reference photo
  learn_per_group: 5      # reference photos taken from one confirmed group of faces on the review page
  group_days: 14          # unknown faces are grouped with similar ones seen this recently
  seen_again_score: 0     # an unclear face this similar to someone already checked in today is not sent for review.
                          # 0 = off (safe with masks: masked faces look alike, so a colleague could be dropped as
                          # "already in"). Try 0.3 only when nobody wears a mask and review repeats the same faces.

tracking:
  # face:   follow faces between frames (light; fine for one or two people at a time).
  # person: also detect and follow whole people (YOLOX + ByteTrack), so names stay apart when a
  #         group walks in together. Needs: python -m attendance download-models --person
  mode: face
  person_model: models/yolox_tiny.onnx  # yolox_s.onnx is more accurate and about 3x slower
  person_conf: 0.5        # confidence needed to start following a person
  head_crop_size: 320     # faces are also searched in each person's head region at this size
  full_frame_every: 4     # person mode: search the whole frame for faces every Nth frame only

google_chat:
  webhook_url: ""         # Space -> Apps & integrations -> Webhooks -> Add webhook
  mention_people: true    # @mention late and missing people (needs each employee's Google Chat user ID)
  notify_late_arrivals: true
  unknown_batch_minutes: 5   # group unknown-face notices instead of one message per face

late_message:             # one message a day listing who came late
  enabled: true
  intro: "Morning, coming late today:"
  item: "{mention} ({time})"   # {mention}, {name}, {time}, {minutes}
  auto_send: true
  send_at: ""             # empty = when the camera stops (window_end); or a time after late_after
  photo: true             # attach one picture of the late people: each cut out of the camera photo, on a
                          # cheerful background (drawn, or uploaded in Settings), with a name tag and the time.
                          # Shown in Google Chat only when web.public_url is an https address reachable
                          # from the internet (e.g. Tailscale Funnel); otherwise the message links to it.
                          # The cutout model (models/u2netp.onnx, 4.5 MB) is downloaded on the first start;
                          # until then the people are cut out more roughly with OpenCV alone.


leave_api:
  # HR system endpoint for holidays, make-up work days and employee leave (format: see README).
  url: ""                 # empty: leave and holidays are not taken into account
  token: ""               # sent as "Authorization: Bearer <token>"
  refresh_minutes: 15     # also refreshed just before the late time every day
  days_back: 7
  days_ahead: 60

web:
  enabled: true
  host: 0.0.0.0
  port: 8000
  public_url: "http://192.168.1.10:8000"  # address the admin opens; used for links in Google Chat
  username: admin
  password: ""            # set one, otherwise anyone on the network can open the page
